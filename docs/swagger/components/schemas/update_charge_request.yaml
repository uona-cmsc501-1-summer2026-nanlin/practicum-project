title: UpdateChargeRequest
type: object
required:
  - description
  - amount
  - paidByUserId
  - participantIds
properties:
  description:
    type: string
  amount:
    type: number
    format: double
    minimum: 0.01
  paidByUserId:
    type: integer
    format: int64
  participantIds:
    type: array
    items:
      type: integer
      format: int64
  splitRule:
    type: string
    default: equal
