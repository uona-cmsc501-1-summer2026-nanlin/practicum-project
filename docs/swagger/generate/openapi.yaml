openapi: 3.1.0
info:
  version: 0.3.0
  title: Split It API
  description: |
    REST API for splitting shared expenses. See docs/swagger/markdown/app_description.md for workflow details.
servers:
  - url: http://localhost:55555
tags:
  - name: General
    description: Health and service info
  - name: Groups
    description: Bill-split sessions
  - name: People
    description: Global people (reusable across groups)
  - name: Members
    description: Group membership
  - name: Charges
    description: Shared expenses
  - name: Settle
    description: Net balances and transfers
  - name: Internal (testing)
    description: |
      Dev-only helpers for wiping test data. Not for production — will be deprecated and removed soon.
paths:
  /health:
    get:
      tags:
        - General
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
  /api/v1/currencies:
    get:
      tags:
        - General
      summary: List allowed currencies
      operationId: listCurrencies
      responses:
        '200':
          description: Currency options (code, name, flag)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/currency_option'
  /api/v1/groups:
    post:
      tags:
        - Groups
      summary: Create a group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_group_request'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      code:
                        example: 201
                      data:
                        $ref: '#/components/schemas/group'
        '400':
          $ref: '#/components/responses/error'
    get:
      tags:
        - Groups
      summary: List groups
      operationId: listGroups
      parameters:
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/group'
  /api/v1/groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Get group by id
      operationId: getGroup
      parameters:
        - $ref: '#/components/parameters/group_id'
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/group'
        '404':
          $ref: '#/components/responses/error'
    put:
      tags:
        - Groups
      summary: Update group name and currency
      operationId: updateGroup
      parameters:
        - $ref: '#/components/parameters/group_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_group_request'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/group'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
    delete:
      tags:
        - Groups
      summary: Delete group
      operationId: deleteGroup
      parameters:
        - $ref: '#/components/parameters/group_id'
      responses:
        '204':
          description: Group deleted
        '404':
          $ref: '#/components/responses/error'
  /api/v1/people:
    post:
      tags:
        - People
      summary: Create a global person
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_person_request'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      code:
                        example: 201
                      data:
                        $ref: '#/components/schemas/person'
        '400':
          $ref: '#/components/responses/error'
    get:
      tags:
        - People
      summary: List all people
      operationId: listPeople
      parameters:
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: People list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/person'
  /api/v1/people/{id}:
    get:
      tags:
        - People
      summary: Get person by id
      operationId: getPerson
      parameters:
        - $ref: '#/components/parameters/person_id'
      responses:
        '200':
          description: Person found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/person'
        '404':
          $ref: '#/components/responses/error'
    put:
      tags:
        - People
      summary: Update person
      operationId: updatePerson
      parameters:
        - $ref: '#/components/parameters/person_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_person_request'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/person'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
    delete:
      tags:
        - People
      summary: Delete person
      description: Blocked if the person is still in any group or referenced by a charge.
      operationId: deletePerson
      parameters:
        - $ref: '#/components/parameters/person_id'
      responses:
        '204':
          description: Person deleted
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
  /api/v1/groups/{groupId}/members:
    post:
      tags:
        - Members
      summary: Add existing person to group
      operationId: addMember
      parameters:
        - $ref: '#/components/parameters/group_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/add_member_request'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      code:
                        example: 201
                      data:
                        $ref: '#/components/schemas/person'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
    get:
      tags:
        - Members
      summary: List members in group
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/group_id'
      responses:
        '200':
          description: Members list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/person'
        '404':
          $ref: '#/components/responses/error'
  /api/v1/groups/{groupId}/members/{userId}:
    delete:
      tags:
        - Members
      summary: Remove member from group
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/group_id'
        - $ref: '#/components/parameters/user_id'
      responses:
        '204':
          description: Member removed
        '404':
          $ref: '#/components/responses/error'
  /api/v1/groups/{groupId}/charges:
    post:
      tags:
        - Charges
      summary: Add charge to group
      operationId: createCharge
      parameters:
        - $ref: '#/components/parameters/group_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_charge_request'
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      code:
                        example: 201
                      data:
                        $ref: '#/components/schemas/charge'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
    get:
      tags:
        - Charges
      summary: List charges in group
      operationId: listCharges
      parameters:
        - $ref: '#/components/parameters/group_id'
        - name: paidBy
          in: query
          schema:
            type: integer
        - name: minAmount
          in: query
          schema:
            type: number
        - name: maxAmount
          in: query
          schema:
            type: number
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Charge list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/charge'
        '404':
          $ref: '#/components/responses/error'
  /api/v1/groups/{groupId}/charges/{chargeId}:
    get:
      tags:
        - Charges
      summary: Get charge by id
      operationId: getCharge
      parameters:
        - $ref: '#/components/parameters/group_id'
        - $ref: '#/components/parameters/charge_id'
      responses:
        '200':
          description: Charge found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/charge'
        '404':
          $ref: '#/components/responses/error'
    put:
      tags:
        - Charges
      summary: Update charge
      operationId: updateCharge
      parameters:
        - $ref: '#/components/parameters/group_id'
        - $ref: '#/components/parameters/charge_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_charge_request'
      responses:
        '200':
          description: Charge updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/charge'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
    delete:
      tags:
        - Charges
      summary: Delete charge
      operationId: deleteCharge
      parameters:
        - $ref: '#/components/parameters/group_id'
        - $ref: '#/components/parameters/charge_id'
      responses:
        '204':
          description: Charge deleted
        '404':
          $ref: '#/components/responses/error'
  /api/v1/groups/{groupId}/settle:
    post:
      tags:
        - Settle
      summary: Compute settlement for a group
      operationId: settleGroup
      parameters:
        - $ref: '#/components/parameters/group_id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/settle_request'
      responses:
        '200':
          description: Settlement result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/settle_response'
        '404':
          $ref: '#/components/responses/error'
  /api/v1/internal/testing/truncate/charges:
    delete:
      tags:
        - Internal (testing)
      summary: Truncate all charges
      description: |
        **Internal testing only — not for production.** Deletes every row in `charges` and resets the table auto-increment counter. Will be removed in a future release.
      operationId: truncateCharges
      deprecated: true
      responses:
        '200':
          description: Charges truncated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/truncate_response'
        '500':
          $ref: '#/components/responses/error'
  /api/v1/internal/testing/truncate/people:
    delete:
      tags:
        - Internal (testing)
      summary: Truncate all people
      description: |
        **Internal testing only — not for production.** Deletes every row in `users` and `group_members`, then resets auto-increment counters. Will be removed in a future release.
      operationId: truncatePeople
      deprecated: true
      responses:
        '200':
          description: People truncated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/truncate_response'
        '500':
          $ref: '#/components/responses/error'
  /api/v1/internal/testing/truncate/groups:
    delete:
      tags:
        - Internal (testing)
      summary: Truncate all groups (and related data)
      description: |
        **Internal testing only — not for production.** Deletes all charges, members, people (users), and groups, then resets auto-increment counters. Same effect as truncate-all for the current schema. Will be removed in a future release.
      operationId: truncateGroups
      deprecated: true
      responses:
        '200':
          description: Groups and related data truncated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/truncate_response'
        '500':
          $ref: '#/components/responses/error'
  /api/v1/internal/testing/truncate/all:
    delete:
      tags:
        - Internal (testing)
      summary: Truncate all data
      description: |
        **Internal testing only — not for production.** Deletes every charge, person, and group, then resets auto-increment counters. Will be removed in a future release.
      operationId: truncateAll
      deprecated: true
      responses:
        '200':
          description: All data truncated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/reply_success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/truncate_response'
        '500':
          $ref: '#/components/responses/error'
components:
  schemas:
    reply_success:
      title: ReplySuccessEnvelope
      type: object
      properties:
        mime_type:
          type: string
          example: application/json
        code:
          type: integer
          example: 200
        status:
          type: string
          enum:
            - success
            - error
            - processing
            - pending
            - failed
            - other
          example: success
        message:
          type: string
          nullable: true
        data:
          type: object
          description: Endpoint-specific payload
    currency_code:
      title: CurrencyCode
      type: string
      description: ISO 4217 currency code accepted by the API.
      default: USD
      enum:
        - USD
        - EUR
        - GBP
        - CAD
        - AUD
        - JPY
        - CNY
        - CHF
        - INR
        - MXN
        - BRL
        - KRW
      example: USD
    currency_option:
      title: CurrencyOption
      type: object
      properties:
        code:
          $ref: '#/components/schemas/currency_code'
        name:
          type: string
          example: US Dollar
        country:
          type: string
          description: ISO 3166-1 alpha-2 country/region code used for flag images (eu for Euro).
          example: us
    group:
      title: Group
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        currency:
          $ref: '#/components/schemas/currency_code'
        createdAt:
          type: string
          format: date-time
    create_group_request:
      title: CreateGroupRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
        currency:
          $ref: '#/components/schemas/currency_code'
    reply_error:
      title: ReplyErrorEnvelope
      type: object
      properties:
        mime_type:
          type: string
          example: application/problem+json
        code:
          type: integer
          example: 400
        status:
          type: string
          example: error
        error:
          type: array
          items:
            type: string
          example:
            - name is required
        message:
          type: string
          example: validation failed
    update_group_request:
      title: UpdateGroupRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
        currency:
          $ref: '#/components/schemas/currency_code'
    person:
      title: Person
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
    create_person_request:
      title: CreatePersonRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
        email:
          type: string
    update_person_request:
      title: UpdatePersonRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
        email:
          type: string
    add_member_request:
      title: AddMemberRequest
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          format: int64
    charge:
      title: ChargeResponse
      type: object
      properties:
        id:
          type: integer
          format: int64
        groupId:
          type: integer
          format: int64
        description:
          type: string
        amount:
          type: number
          format: double
        paidByUserId:
          type: integer
          format: int64
        participantIds:
          type: array
          items:
            type: integer
            format: int64
        splitRule:
          type: string
          example: equal
        sharePerPerson:
          type: number
          format: double
    create_charge_request:
      title: CreateChargeRequest
      type: object
      required:
        - description
        - amount
        - paidByUserId
      properties:
        description:
          type: string
        amount:
          type: number
          format: double
          minimum: 0.01
        paidByUserId:
          type: integer
          format: int64
        participantIds:
          type: array
          items:
            type: integer
            format: int64
        splitRule:
          type: string
          default: equal
    update_charge_request:
      title: UpdateChargeRequest
      type: object
      required:
        - description
        - amount
        - paidByUserId
        - participantIds
      properties:
        description:
          type: string
        amount:
          type: number
          format: double
          minimum: 0.01
        paidByUserId:
          type: integer
          format: int64
        participantIds:
          type: array
          items:
            type: integer
            format: int64
        splitRule:
          type: string
          default: equal
    settle_request:
      title: SettleRequest
      type: object
      properties:
        onlyChargeIds:
          type: array
          items:
            type: integer
            format: int64
    balance_row:
      title: BalanceRow
      type: object
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: string
        net:
          type: number
          format: double
    transfer_row:
      title: TransferRow
      type: object
      properties:
        fromUserId:
          type: integer
          format: int64
        fromName:
          type: string
        toUserId:
          type: integer
          format: int64
        toName:
          type: string
        amount:
          type: number
          format: double
    settle_response:
      title: SettleResponse
      type: object
      properties:
        groupId:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/currency_code'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/balance_row'
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/transfer_row'
    truncate_response:
      title: TruncateResponse
      type: object
      description: Count of rows deleted per table.
      properties:
        charges:
          type: integer
          format: int64
          example: 3
        people:
          type: integer
          format: int64
          example: 0
        members:
          type: integer
          format: int64
          example: 0
        groups:
          type: integer
          format: int64
          example: 0
  responses:
    error:
      description: Client or server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/reply_error'
  parameters:
    group_id:
      name: groupId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    person_id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    user_id:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    charge_id:
      name: chargeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
