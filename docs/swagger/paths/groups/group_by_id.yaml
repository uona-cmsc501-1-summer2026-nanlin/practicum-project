get:
  tags: [Groups]
  summary: Get group by id
  operationId: getGroup
  parameters:
    - $ref: ../../components/parameters/group_id.yaml
  responses:
    "200":
      description: Group found
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/reply_success.yaml
              - type: object
                properties:
                  data:
                    $ref: ../../components/schemas/group.yaml
    "404":
      $ref: ../../components/responses/error.yaml
put:
  tags: [Groups]
  summary: Update group name and currency
  operationId: updateGroup
  parameters:
    - $ref: ../../components/parameters/group_id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/update_group_request.yaml
  responses:
    "200":
      description: Group updated
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/reply_success.yaml
              - type: object
                properties:
                  data:
                    $ref: ../../components/schemas/group.yaml
    "400":
      $ref: ../../components/responses/error.yaml
    "404":
      $ref: ../../components/responses/error.yaml
delete:
  tags: [Groups]
  summary: Delete group
  operationId: deleteGroup
  parameters:
    - $ref: ../../components/parameters/group_id.yaml
  responses:
    "204":
      description: Group deleted
    "404":
      $ref: ../../components/responses/error.yaml
