get:
  tags: [People]
  summary: Get person by id
  operationId: getPerson
  parameters:
    - $ref: ../../components/parameters/person_id.yaml
  responses:
    "200":
      description: Person found
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/reply_success.yaml
              - type: object
                properties:
                  data:
                    $ref: ../../components/schemas/person.yaml
    "404":
      $ref: ../../components/responses/error.yaml
put:
  tags: [People]
  summary: Update person
  operationId: updatePerson
  parameters:
    - $ref: ../../components/parameters/person_id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/update_person_request.yaml
  responses:
    "200":
      description: Person updated
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/reply_success.yaml
              - type: object
                properties:
                  data:
                    $ref: ../../components/schemas/person.yaml
    "400":
      $ref: ../../components/responses/error.yaml
    "404":
      $ref: ../../components/responses/error.yaml
delete:
  tags: [People]
  summary: Delete person
  description: Blocked if the person is still in any group or referenced by a charge.
  operationId: deletePerson
  parameters:
    - $ref: ../../components/parameters/person_id.yaml
  responses:
    "204":
      description: Person deleted
    "400":
      $ref: ../../components/responses/error.yaml
    "404":
      $ref: ../../components/responses/error.yaml
