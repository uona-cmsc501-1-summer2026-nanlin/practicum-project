delete:
  tags: [Internal (testing)]
  summary: Truncate all people
  description: >
    **Internal testing only — not for production.** Deletes every row in `users`
    and `group_members`, then resets auto-increment counters. Will be removed
    in a future release.
  operationId: truncatePeople
  deprecated: true
  responses:
    "200":
      description: People truncated
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/reply_success.yaml
              - type: object
                properties:
                  data:
                    $ref: ../../components/schemas/truncate_response.yaml
    "500":
      $ref: ../../components/responses/error.yaml
