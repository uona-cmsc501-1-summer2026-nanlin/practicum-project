delete:
  tags: [Internal (testing)]
  summary: Truncate all charges
  description: >
    **Internal testing only — not for production.** Deletes every row in `charges`
    and resets the table auto-increment counter. Will be removed in a future release.
  operationId: truncateCharges
  deprecated: true
  responses:
    "200":
      description: Charges truncated
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/reply_success.yaml
              - type: object
                properties:
                  data:
                    $ref: ../../components/schemas/truncate_response.yaml
    "500":
      $ref: ../../components/responses/error.yaml
