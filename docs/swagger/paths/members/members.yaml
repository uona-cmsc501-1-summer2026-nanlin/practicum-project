post:
  tags: [Members]
  summary: Add existing person to group
  operationId: addMember
  parameters:
    - $ref: ../../components/parameters/group_id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/add_member_request.yaml
  responses:
    "201":
      description: Member added
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/reply_success.yaml
              - type: object
                properties:
                  code:
                    example: 201
                  data:
                    $ref: ../../components/schemas/person.yaml
    "400":
      $ref: ../../components/responses/error.yaml
    "404":
      $ref: ../../components/responses/error.yaml
get:
  tags: [Members]
  summary: List members in group
  operationId: listMembers
  parameters:
    - $ref: ../../components/parameters/group_id.yaml
  responses:
    "200":
      description: Members list
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/reply_success.yaml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/person.yaml
    "404":
      $ref: ../../components/responses/error.yaml
